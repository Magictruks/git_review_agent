name: Gemini PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Get PR Diff
        run: |
          git diff origin/${{ github.base_ref }}...origin/${{ github.head_ref }} \
          -- . ':!node_modules' ':!*-lock.json' ':!*.md' ':!*.lock' ':!*.png' ':!*.jpg' > diff.txt

      - name: Run Gemini Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pip install PyGithub google-genai
          python scripts/ai_reviewer.py diff.txt
